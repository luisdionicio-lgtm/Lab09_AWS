services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-lab-09-dionicio-20261014}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      AWS_PROFILE: ${AWS_PROFILE:-lab09-nuevo}
      AWS_SHARED_CREDENTIALS_FILE: /home/node/.aws/credentials
      AWS_CONFIG_FILE: /home/node/.aws/config
    volumes:
      - type: bind
        source: ${USERPROFILE}/.aws
        target: /home/node/.aws
        read_only: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
